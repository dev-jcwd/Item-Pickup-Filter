// Minecraft 26.1 and newer (official Mojang names, no remapping). The 1.21.x build is build.gradle.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.shedaniel.me/" }          // Cloth Config
    maven { url "https://maven.terraformersmc.com/" }    // Mod Menu
}

sourceSets.main.java.setSrcDirs(["src/shared/java", "src/official/java", "src/compat/${project.compat}/java"])

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}")
    localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}")
}

processResources {
    def props = [version: project.version, mc_range: project.mc_range, java_version: project.java_version]
    inputs.properties(props)
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") { expand props }
    filesMatching("ipf.mixins.json") { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
    from("LICENSE.md") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
