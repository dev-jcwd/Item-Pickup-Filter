org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod Information
mod_version=1.1.0
maven_group=com.ipf
archives_base_name=item-pickup-filter

# Loader / Loom (same for every Minecraft version)
loader_version=0.18.1
loom_version=1.19-SNAPSHOT

# --- Build target. Defaults to 1.21.8; build-all.ps1 builds every supported version. ---
# lane: "yarn" = 1.21 - 1.21.11 (Yarn names, Java 21)   "official" = 26.1 and newer (Mojang names, Java 25)
lane=yarn
minecraft_version=1.21.8
yarn_mappings=1.21.8+build.1
fabric_version=0.136.1+1.21.8
cloth_config_version=19.0.147
modmenu_version=15.0.2
# Which src/compat/<name> folder supplies the version-specific calls
compat=y2
# Minecraft versions written into fabric.mod.json
mc_range=>=1.21.2 <=1.21.8
# Java the jar targets
java_version=21
